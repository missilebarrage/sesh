name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('scripts/bootstrap.sh') }}
      - name: Install toolchain
        run: scripts/bootstrap.sh
      - name: Lint and test
        run: scripts/test.sh
